name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install typescript
        run: npm install --no-save typescript@5.6.3 @types/node
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test --experimental-strip-types test/*.test.ts
      - name: Smoke (real MCP spawn via uvx)
        if: matrix.os != 'windows-latest'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          node --experimental-strip-types -e "import('./src/mcp-client.ts').then(async ({ MailboxMcpClient }) => { const c = new MailboxMcpClient('uvx', 'git+https://github.com/polaris-smart/agent-mailbox', '', 90000); try { const out = await c.callTool('mailbox_whoami', {}); if (!out || out.length === 0) throw new Error('empty whoami'); console.log('SMOKE_OK'); } finally { c.dispose(); } }).catch((e) => { console.error('SMOKE_FAIL', e.message); process.exit(1); });"

  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --no-save typescript@5.6.3 @types/node
      - run: npx tsc -p tsconfig.build.json
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
