name: CI

on:
  push:
    branches: [main, feat/v080-project-mcp]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install typescript
        run: npm install --no-save typescript@5.9.3 @types/node --registry=https://registry.npmjs.org
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test --experimental-strip-types test/*.test.ts
      - name: Build + dist extension gate
        run: |
          npm run build
          node scripts/assert-dist-ext.mjs
      - name: Packed-artifact entry gate (node_modules import + negative control)
        run: node scripts/assert-nm-entry.mjs
      - name: Verify publication file whitelist
        run: npm pack --dry-run --registry=https://registry.npmjs.org

  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install --no-save typescript@5.9.3 @types/node --registry=https://registry.npmjs.org
      - run: npm run build
      - name: Verify dist entry resolves + extensions clean
        run: |
          node -e "import('./dist/plugin.js').then((m) => { if (m.name !== 'dsh-agent-mailbox') throw new Error('unexpected plugin export: ' + m.name); console.log('DIST_OK'); }).catch((e) => { console.error('DIST_FAIL', e.message); process.exit(1); });"
          node scripts/assert-dist-ext.mjs
      - run: npm publish --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
