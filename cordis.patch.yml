# Project mailbox connection for an existing DSH session. Export the private
# session file from the workbench; do not put provider keys or tokens here.
- insert:
    - id: dsh-agent-mailbox
      name: dsh-agent-mailbox
      config:
        sessionFile: /absolute/path/to/private/employee-session.json
        executable: agent-mailbox
        executableArgs: []
